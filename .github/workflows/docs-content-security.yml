name: Documentation credential check
on:
  pull_request:
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs-content-security.yml'
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - '.github/workflows/docs-content-security.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test apps/docs/scripts/check-content-secrets.test.mjs
      - run: node apps/docs/scripts/check-content-secrets.mjs
