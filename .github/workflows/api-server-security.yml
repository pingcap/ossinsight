name: API server security

on:
  pull_request:
    paths:
      - 'packages/api-server/**'
      - 'packages/types/**'
      - 'packages/pipeline/**'
      - 'packages/prefetch/**'
      - 'apps/web/lib/server/**'
      - 'apps/web/app/**'
      - 'configs/pipelines/**'
      - 'apps/web/lib/request-policy.ts'
      - 'apps/web/lib/content-security.ts'
      - 'apps/web/next.config.mjs'
      - 'apps/web/vercel.json'
      - 'etl/config/database.yml'
      - 'etl/config/environments/production.rb'
      - 'apps/web/proxy.ts'
      - 'packages/site-shell/src/safe-json.ts'
      - 'packages/sync-github-data/**'
      - 'scripts/load-collection.mjs'
      - 'scripts/lib/**'
      - 'etl/lib/sample_importer.rb'
      - 'etl/lib/tasks/import.rake'
      - 'etl/test/sample_importer_test.rb'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-server-security.yml'
  push:
    branches: [main]
    paths:
      - 'packages/api-server/**'
      - 'packages/types/**'
      - 'packages/pipeline/**'
      - 'packages/prefetch/**'
      - 'apps/web/lib/server/**'
      - 'apps/web/app/**'
      - 'configs/pipelines/**'
      - 'apps/web/lib/request-policy.ts'
      - 'apps/web/lib/content-security.ts'
      - 'apps/web/next.config.mjs'
      - 'apps/web/vercel.json'
      - 'etl/config/database.yml'
      - 'etl/config/environments/production.rb'
      - 'apps/web/proxy.ts'
      - 'packages/site-shell/src/safe-json.ts'
      - 'packages/sync-github-data/**'
      - 'scripts/load-collection.mjs'
      - 'scripts/lib/**'
      - 'etl/lib/sample_importer.rb'
      - 'etl/lib/tasks/import.rake'
      - 'etl/test/sample_importer_test.rb'
      - 'pnpm-lock.yaml'
      - '.github/workflows/api-server-security.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.29.3
      - run: pnpm install --filter @ossinsight/api-server... --filter @ossinsight/pipeline... --filter @ossinsight/prefetch... --filter @ossinsight/sync-github-data... --filter web... --frozen-lockfile --ignore-scripts --network-concurrency 12 --child-concurrency 12
      - name: Build native SQLite for the runner
        run: pnpm --filter @ossinsight/api-server rebuild sqlite3
        env:
          npm_config_build_from_source: 'true'
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high
      - run: pnpm --filter @ossinsight/api-server... --filter @ossinsight/pipeline... --filter @ossinsight/prefetch... --filter @ossinsight/sync-github-data... --workspace-concurrency 12 -r build
      - run: pnpm --filter @ossinsight/sync-github-data test:security
      - run: pnpm --filter @ossinsight/api-server test:security
      - run: pnpm --filter @ossinsight/api-server test:runtime
      - run: node --test scripts/lib/collection-store.test.mjs
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1
        with:
          ruby-version: '3.3'
      - run: ruby etl/test/sample_importer_test.rb
      - name: Verify ETL transport defaults
        run: |
          ruby -rerb -ryaml -rjson -ropenssl -e 'config = YAML.safe_load(ERB.new(File.read("etl/config/database.yml")).result, permitted_classes: [Symbol], aliases: true); abort "TLS not enforced" unless config["production"]["ssl_mode"] == :verify_identity'
      - name: Verify TiDB execution and database grants
        env:
          NODE_OPTIONS: --experimental-vm-modules
        working-directory: packages/api-server
        run: pnpm exec jest --maxWorkers=12 --runTestsByPath __tests__/core/executor/query-executor/TiDBPlaygroundQueryExecutor.ts __tests__/worker/queue-worker.ts __tests__/core/email-rekey.ts __tests__/core/app-startup.ts
